<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circle 이용약관 및 개인정보 안내</title><style>body{max-width:850px;margin:40px auto;padding:20px;font-family:sans-serif;color:#233c2c}pre{white-space:pre-wrap;font:inherit;line-height:1.9}nav{display:flex;gap:20px}#status{color:#765314}</style></head><body><h1>Circle 이용약관 및 개인정보 안내</h1><nav><a href="#terms">이용약관</a><a href="#privacy">개인정보 안내</a></nav><p id="status">안내를 불러오는 중입니다.</p><h2 id="terms">이용약관</h2><pre id="terms-text"></pre><h2 id="privacy">개인정보 수집·이용 및 처리 안내</h2><pre id="privacy-text"></pre><script src="config.js"></script><script type="module">
import {createStore} from './store.js';import {policyText,policiesReady} from './policies.js';
const render=config=>{document.getElementById('terms-text').textContent=policyText('terms',config);document.getElementById('privacy-text').textContent=policyText('privacy',config);document.getElementById('status').textContent=policiesReady(config)?'정책 버전 1.0.0':'출시 준비 중인 초안입니다. 운영 정보 확인이 필요합니다.'};
render({});try{const store=await createStore();store.watchRelease?.(render,()=>{document.getElementById('status').textContent='운영 정보를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.'})}catch{document.getElementById('status').textContent='운영 정보를 불러오지 못했습니다.'}
</script></body></html>
